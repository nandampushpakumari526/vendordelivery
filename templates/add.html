
<h2>Add Vendor Details</h2>

<form method="POST">

    <input type="number" step="any" name="lead_time" placeholder="Lead Time" required><br><br>

    <input type="number" step="any" name="order_quantity" placeholder="Order Quantity" required><br><br>

    <input type="number" step="any" name="vendor_rating" placeholder="Vendor Rating" required><br><br>

    <input type="number" step="any" name="distance_km" placeholder="Distance KM" required><br><br>

    <input type="number" step="any" name="past_delays" placeholder="Past Delays" required><br><br>

    <input type="number" name="season_peak" placeholder="Season Peak (0 or 1)" min="0" max="1" required><br><br>

    <label>Delivered On Time:</label>
    <select name="delivered_on_time" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <br><br>
    <button type="submit">Add Vendor</button>

</form>
