<!DOCTYPE html>
<html>
<head>
    <title>Add Vendor Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center">Add Vendor Record</h2>
        <hr>

        <form method="POST">

            <div class="row">
                <div class="col-md-6">
                    <label>Lead Time (Days)</label>
                    <input class="form-control" type="number" step="any" name="lead_time" required>
                </div>

                <div class="col-md-6">
                    <label>Order Quantity</label>
                    <input class="form-control" type="number" step="any" name="order_quantity" required>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-md-6">
                    <label>Vendor Rating (1-5)</label>
                    <input class="form-control" type="number" min="1" max="5" step="1" name="vendor_rating" required>
                </div>

                <div class="col-md-6">
                    <label>Distance (KM)</label>
                    <input class="form-control" type="number" step="any" name="distance_km" required>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-md-6">
                    <label>Past Delay Count</label>
                    <input class="form-control" type="number" step="1" name="past_delays" required>
                </div>

                <div class="col-md-6">
                    <label>Season</label>
                    <select class="form-control" name="season_peak">
                        <option value="0">Normal Season</option>
                        <option value="1">Peak Season</option>
                    </select>
                </div>
            </div>

            <div class="mt-3">
                <label>Delivery Status</label>
                <select class="form-control" name="delivered_on_time">
                    <option value="1">On-Time</option>
                    <option value="0">Delayed</option>
                </select>
            </div>

            <button class="btn btn-primary mt-4 w-100">Save Record</button>
            <a href="/dashboard" class="btn btn-secondary mt-2 w-100">Back to Dashboard</a>

        </form>

    </div>
</div>

</body>
</html>
