<!DOCTYPE html>
<html>
<head>
    <title>Predict Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center">Predict Delivery Outcome</h3>
        <hr>

        <form method="POST">

            <div class="row">
                <div class="col-md-6">
                    <input class="form-control mt-2" type="number" step="any" name="lead_time" placeholder="Lead Time (Days)" required>
                </div>
                <div class="col-md-6">
                    <input class="form-control mt-2" type="number" step="any" name="order_quantity" placeholder="Order Quantity" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <input class="form-control mt-2" type="number" step="any" name="vendor_rating" placeholder="Vendor Rating (1-5)" required>
                </div>
                <div class="col-md-6">
                    <input class="form-control mt-2" type="number" step="any" name="distance_km" placeholder="Distance (KM)" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <input class="form-control mt-2" type="number" step="any" name="past_delays" placeholder="Past Delay Count" required>
                </div>
                <div class="col-md-6">
                    <select class="form-control mt-2" name="season_peak">
                        <option value="0">Normal Season</option>
                        <option value="1">Peak Season</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-success mt-4 w-100">Predict Now</button>
            <a href="/dashboard" class="btn btn-secondary mt-2 w-100">Back to Dashboard</a>

        </form>
    </div>
</div>

</body>
</html>
