<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 text-center">

        <h2>Prediction Result</h2>
        <hr>

        <h3 class="mt-3">{{ result }}</h3>

        <div class="alert alert-info mt-4">
            <strong>Probability of On-Time:</strong> {{ probability }} %
        </div>

        <a href="/predict" class="btn btn-success mt-3 w-100">New Prediction</a>
        <a href="/dashboard" class="btn btn-secondary mt-2 w-100">Back to Dashboard</a>

    </div>
</div>

</body>
</html>
